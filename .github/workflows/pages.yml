name: Deploy 사이트 (블로그 + 오이마켓 앱)

# 한 GitHub Pages 사이트에 블로그(루트)와 오이마켓 앱(/app/)을 함께 배포한다.
#   https://<user>.github.io/road-capacity-blog/       → 블로그
#   https://<user>.github.io/road-capacity-blog/app/   → 오이마켓 앱(PWA)
# Pages 설정은 "Deploy from a branch → gh-pages → /(root)" 그대로 유지.

on:
  push:
    branches:
      - claude/incheon-institute-trading-app-9l5abl
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install blog build deps
        run: npm install --no-audit --no-fund

      - name: Build blog → dist/
        run: node src/build.js

      - name: Add 오이마켓 앱 under /app (문서 제외)
        run: |
          mkdir -p dist/app
          cp -R app/. dist/app/
          rm -rf dist/app/docs
          touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy blog + app (${{ github.sha }})"
