<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>인천연구원 나눔장터</title>
  <meta name="description" content="인천연구원 원내 직원 전용 중고물품·재능 거래 앱 (프로토타입)">
  <meta name="theme-color" content="#ff6f3c">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="나눔장터">

  <!-- FOUC 방지: 테마를 <head>에서 먼저 적용 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("ii-market:theme");
        var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (sysDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="app" role="application" aria-label="인천연구원 나눔장터"></div>
  <div id="toast" aria-live="polite"></div>

  <script src="./js/store.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
