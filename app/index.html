<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>오이마켓 · 인천연구원</title>
  <meta name="description" content="오이마켓 — 인천연구원 원내 직원 전용 중고물품·재능 거래 앱 (프로토타입)">
  <meta name="theme-color" content="#2b8a3e">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="오이마켓">

  <!-- FOUC 방지: 테마를 <head>에서 먼저 적용 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("ii-market:theme");
        var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (sysDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="app" role="application" aria-label="오이마켓">
    <!-- 인천연구원 코브랜드: 라우팅과 무관하게 항상 상단에 노출 -->
    <div id="cobrand" aria-label="인천연구원 제공">
      <img class="ci-emblem" src="./icons/institute-logo.svg" alt="인천연구원 로고" width="30" height="20">
      <span class="ci-name">인천연구원</span>
      <span class="ci-sub">Incheon Institute</span>
      <span class="ci-provide">오이마켓</span>
    </div>
    <div id="view"></div>
  </div>
  <div id="toast" aria-live="polite"></div>

  <script src="./js/store.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
