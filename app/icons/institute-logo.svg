<svg xmlns="http://www.w3.org/2000/svg" width="66" height="44" viewBox="0 0 66 44" fill="none">
  <!-- 인천연구원 심볼 재현(공식 CI 근사) : 파란 링 + 마크 + 청록 열린 링 -->
  <!-- 왼쪽 링 -->
  <circle cx="13" cy="17" r="11" stroke="#1f7ac4" stroke-width="6"/>
  <!-- 가운데 마크 -->
  <g stroke="#15559c" stroke-width="6" stroke-linecap="round">
    <line x1="27" y1="13" x2="48" y2="13"/>
    <line x1="37.5" y1="4" x2="37.5" y2="13"/>
    <line x1="37" y1="14" x2="28.5" y2="30"/>
    <line x1="37" y1="14" x2="46.5" y2="28"/>
  </g>
  <!-- 오른쪽 아래 열린 링(청록) -->
  <g transform="rotate(-58 53 30)">
    <circle cx="53" cy="30" r="9.5" stroke="#2aa9e0" stroke-width="6"
            stroke-dasharray="46 14" stroke-linecap="butt"/>
  </g>
</svg>
