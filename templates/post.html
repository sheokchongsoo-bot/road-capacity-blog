<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{title}}</h1>
    <p class="post-meta">
      <time datetime="{{dateISO}}">{{dateDisplay}}</time>
      {{tagsHtml}}
    </p>
  </header>
  <div class="post-body">
    {{body}}
  </div>
  <p class="post-back"><a href="{{base}}index.html">← 목록으로</a></p>
</article>
